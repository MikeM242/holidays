<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Weather Matrix</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent: #059669;
            --high-temp-bg: #fef3c7;
            --high-temp-text: #b45309;
            --low-temp-bg: #ccfbf1;
            --low-temp-text: #0f766e;
            --precip-bg: #e0f2fe;
            --precip-text: #0369a1;
            --border: #cbd5e1;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
        }
        .container {
            max-width: 950px;
            margin: 2rem auto;
            background: var(--surface);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .title-area {
            margin-top: 0;
            font-size: 2.25rem;
            font-weight: 800;
            color: #065f46;
            letter-spacing: -0.025em;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .selector-box {
            margin-bottom: 3rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        label { 
            font-weight: 700; 
            color: var(--text-muted); 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            letter-spacing: 0.1em; 
        }
        select {
            padding: 0.85rem 1.25rem;
            font-size: 1.05rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: #ffffff;
            color: var(--text-main);
            cursor: pointer;
            outline: none;
            width: 100%;
            max-width: 450px;
            transition: all 0.2s ease;
        }
        select:focus { 
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.15);
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 6px;
            text-align: left;
            margin-top: 1rem;
        }
        th {
            padding: 1rem;
            font-weight: 700;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 2px solid #e2e8f0;
        }
        td {
            padding: 1.1rem 1rem;
            background: #f8fafc;
            border-top: 1px solid #f1f5f9;
            border-bottom: 1px solid #f1f5f9;
            transition: all 0.2s ease;
        }
        td:first-child {
            border-left: 1px solid #f1f5f9;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            font-weight: 600;
        }
        td:last-child {
            border-right: 1px solid #f1f5f9;
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
        }
        tr:hover td { 
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        .temp-badge {
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            font-weight: 700;
            display: inline-block;
            font-size: 0.9rem;
        }
        .temp-high {
            background: var(--high-temp-bg);
            color: var(--high-temp-text);
            border: 1px solid rgba(180, 83, 9, 0.15);
        }
        .temp-low {
            background: var(--low-temp-bg);
            color: var(--low-temp-text);
            border: 1px solid rgba(15, 118, 110, 0.15);
        }
        .precip-badge {
            background: var(--precip-bg);
            color: var(--precip-text);
            border: 1px solid rgba(3, 105, 161, 0.15);
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            font-weight: 600;
            display: inline-block;
            font-size: 0.9rem;
        }
        .no-data {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            font-style: italic;
            background: transparent !important;
            border: none !important;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="title-area" id="mainHeader">🌤️ Holiday Weather Dashboard Matrix</h1>
    
    <div class="selector-box">

            <tr>

            </tr>
        </tbody>
    </table>
</div>

    const selectedHoliday = select.value;
    const tbody = document.getElementById('tableBody');
    const header = document.getElementById('mainHeader');
    
    tbody.innerHTML = "";
    
    if (!selectedHoliday || !weatherDatabase[selectedHoliday]) {
        header.innerHTML = "🌤️ Holiday Weather Dashboard Matrix";
        tbody.innerHTML = '<tr><td colspan="4" class="no-data">Select an observance from the menu above to unpack historical climate trends.</td></tr>';
        return;
    }
    
    // Dynamically shift dashboard header title string to include match icon
    const activeIcon = holidayIcons[selectedHoliday] || "📅";
    header.innerHTML = `${activeIcon} ${selectedHoliday} Weather History`;
    
    const records = weatherDatabase[selectedHoliday];
    
    records.forEach(row => {
        const tr = document.createElement('tr');
        
        const highDisp = row.high !== "N/A" ? `<span class="temp-badge temp-high">${row.high} °F</span>` : '<span class="text-muted">N/A</span>';
        const lowDisp = row.low !== "N/A" ? `<span class="temp-badge temp-low">${row.low} °F</span>` : '<span class="text-muted">N/A</span>';
        
        let precipDisp = '<span class="text-muted">N/A</span>';
        if (row.precip !== "N/A") {
            const isTrace = row.precip.toUpperCase() === 'T';
            precipDisp = `<span class="precip-badge">💧 ${row.precip}${isTrace ? '' : ' in'}</span>`;
        }
        
        tr.innerHTML = `
            <td><strong>${row.date}</strong></td>
            <td>${highDisp}</td>
            <td>${lowDisp}</td>
            <td>${precipDisp}</td>
        `;
        tbody.appendChild(tr);
    });
}
</script>

</body>
</html>
